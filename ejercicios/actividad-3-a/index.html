<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Actividad 3A</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>
    <body>
        <div class="contenedor-general">
            <div class="contenedor">
                <video src="media/pelicula.mp4" id="video" controls></video>
                <div class="controls">
                    <div class="c-left">
                        <br />
                        <button id="pause"><i class="fa-solid fa-pause"></i></button>
                        <button id="play"><i class="fas fa-play"></i></button>
                        <button id="mute"><i class="fa-solid fa-volume-xmark"></i></button>
                    </div>
                    <div class="c-right">
                        <br />
                        <button id="1"><i class="fa-solid fa-1"></i></button>
                        <button id="2"><i class="fa-solid fa-2"></i></button>
                        <button id="3"><i class="fa-solid fa-3"></i></button>
                        <button id="4"><i class="fa-solid fa-4"></i></button>
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>

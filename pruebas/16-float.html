<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Float</title>
        <style>
            * {
                box-sizing: border-box;
              }
            header, footer {
                background: lavender;
                margin: 0 20px 20px 0;
            }
            .columna {
                background: orange;
                width: 300px;
                height: 200px;
                margin: 0 20px 20px 0;
                float: left;
            }
            .fila {
                overflow: hidden;
            }
            .contenedor {
                width: 1280px;
                margin: auto;
            }
            
            
        </style>
    </head>
    <body>
        
    <div class="contenedor">
        <header>
            <h1>
                Float
            </h1>
        </header>
        
        <article class="fila">
            <div class="columna">A</div>
            <div class="columna">B</div>
            <div class="columna">C</div>
            <div class="columna">D</div>
            <div class="columna">E</div>
            <div class="columna">F</div>
            <div class="columna">G</div>
            <div class="columna">H</div>
        </article>
        
        <footer>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Fugit voluptates explicabo officia, voluptate impedit animi dolorum nobis reiciendis. Saepe ratione placeat at, repudiandae laudantium doloribus est autem numquam culpa laboriosam.</footer>
    </div>
    
    </body>
</html>

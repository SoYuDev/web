<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Formulario</title>
        <style>
             * {
                box-sizing: border-box;
            }
            body {
                font: 1rem 'Segoe UI', sans-serif;
                color: #444;
            }
            h1 {
                text-align: center;
            }
            form {
                max-width: 800px;
                margin: auto;
                background: #f8f8f8;
                padding: 20px;
                border: 1px solid #ddd;
            } 
            .fila {
                display: flex;
                gap: 20px;
                margin-bottom: 20px
            }
            .columna {
                width: 100%;
            }
            input, textarea{
                width: 100%;
                font: 1rem 'Segoe UI', sans-serif; 
                padding: 4px;
                border: 1px solid #ccc;
                border-radius: 4px;
                resize: none;
            }
            input[type='submit'] {
                width: auto;
                background-color: #77B482 ;
                color: white;
                font-size: 1.2rem;
                padding: 8px 25px;
                border: none;
                box-shadow: 0 1px 3px #888;
            }
            input[type='submit']:hover {
                background-color: #8BD298 ;
                box-shadow: 0 3px 3px #888;
            }
            :focus {
                background: #dfd  ;
            }
            
        </style>
    </head>
    <body>
        <header>
            <h1>Formulario</h1>
        </header>
        <article>
            <form action="http://www.cursos-diseño.es/mostrar.php" method="post">
                <div class="fila">
                    <div class="columna">
                        Nombre
                        <input type="text" name="nombre">
                    </div>
                    <div class="columna">
                        1ª apellido
                        <input type="text" name="apellido1">
                    </div>
                    <div class="columna">
                        2º apellido
                        <input type="text" name="apellido2">
                    </div>
                </div>
                <div class="fila">
                    <div class="columna">
                        Dirección
                        <input type="text" name="direccion">
                    </div>
                </div>
                <div class="fila">
                    <div class="columna">
                        Email
                        <input type="email" name="mail">
                    </div>
                    <div class="columna">
                        Teléfono
                        <input type="text" name="telefono">
                    </div>
                </div>
                <div class="fila">
                    <div class="columna">
                        Sugerencias
                        <textarea name="sugerencias" rows="5"></textarea>
                    </div>
                </div>
                <div class="fila">
                    <div class="columna">
                        <input type="submit">
                    </div>
                </div>
                
                
                
            </form>
            
        </article>
    </body>
</html>

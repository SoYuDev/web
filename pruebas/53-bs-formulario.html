<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Formulario BS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Librerias de Bootstrap 5 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="container-fluid text-bg-primary p-5">
<h1>Formularios</h1>
<h2>Bootstrap 5</h2>
</header>

<article class="container">
<form action="">
	<div class="mb-3">
		Nombre
		<input type="text" name="nombre" class="form-control" />
	</div>

	<div class="mb-3">
		Apellido
		<input type="text" name="ciudad" class="form-control" />
	</div>

	<div class="mb-3">
		Pais
		<input type="text" name="pais" class="form-control" />
	</div>
	
	<div class="mb-3">
		Provincia
		<select name="provincia" class="form-control">
			<option value="">Madrid</option>
			<option value="">Toledo</option>
			<option value="">Avila</option>
			<option value="">Segovia</option>
		</select>
	</div>

	<div class="mb-3">
		Población
		<input type="text" name="población" class="form-control" />
	</div>

	<div class="mb-3">
		Curriculum
		<input type="file" name="cv" class="form-control" />
		<div class="form-text">Solo archivos tipo PDF</div>
	</div>
	
	<div class="mb-3">
		Turno
		<label class="form-check">
			<input type="radio" name="turno" value="mañana" 
			class="form-check-input" > Mañana
		</label>
		<label class="form-check">
			<input type="radio" name="turno" value="tarde" 
			class="form-check-input" checked> Tarde
		</label>
		<label class="form-check">
			<input type="radio" name="turno" value="noche" 
			class="form-check-input"> Noche
		</label>
	</div>
	
	<div class="mb-3">
		<label class="form-check">
			<input type="checkbox" name="acepto" value="si" 
			class="form-check-input" > Acepto los terminops y condiciones
		</label>
		<label class="form-check form-switch">
			<input type="checkbox" name="suscripcion" value="si" 
			class="form-check-input" > Quiero suscribieme al boletin de noticias
		</label>
	</div>
	<div class="mb-3">
		Color 
		<input type="color" class="form-control form-control-color">
	</div>

	<input type="submit" class="btn btn-primary" />
</form>
</article>
</body>
</html>
